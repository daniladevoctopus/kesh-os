name: ChatGPT KeshOS Self-Hosted Build

on:
  push:
    branches:
      - chatgpt/keshos-openfyde-work
    paths:
      - "kernel/**"
      - "src/**"
      - "ports/**"
      - "ports_bin/**"
      - "toolchain/**"
      - "build.sh"
      - "generate_ninja.py"
      - ".gitmodules"
      - ".github/workflows/chatgpt-keshos-self-hosted-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chatgpt-keshos-self-hosted-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: KeshOS approved stage
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 240

    env:
      # Stage gate: advance only after the user explicitly approves the next step.
      # Valid values: platform, gn, smoke, iso
      KESH_APPROVED_STAGE: "platform"
      KESH_CHROMIUM_JOBS: "4"
      OPENFYDE_WORKSPACE: ${{ github.workspace }}/../openfyde-kesh-work
      KESH_ARTIFACT_ROOT: ${{ github.workspace }}/../keshos-build-artifacts

    steps:
      - name: Checkout ChatGPT work branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/keshos-openfyde-work
          fetch-depth: 0
          submodules: false
          clean: true

      - name: Runner diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo "runner: $(hostname)"
          echo "workspace: $GITHUB_WORKSPACE"
          echo "commit: $(git rev-parse HEAD)"
          echo "approved stage: $KESH_APPROVED_STAGE"
          echo "cpu: $(nproc) threads"
          free -h || true
          df -h "$GITHUB_WORKSPACE" || true
          mkdir -p "$KESH_ARTIFACT_ROOT"

      - name: Attach persistent local build state
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$KESH_APPROVED_STAGE" == "platform" ]]; then
            echo "Native platform stage: Chromium workspace and musl bridge are not required."
            exit 0
          fi

          SYSROOT=""
          for candidate in \
            "/home/danila/Рабочий стол/keshos/toolchain/musl" \
            "/home/danila/keshos/toolchain/musl"; do
            if [[ -f "$candidate/lib/libc.a" ]]; then
              SYSROOT="$candidate"
              break
            fi
          done
          if [[ -z "$SYSROOT" ]]; then
            SYSROOT_FILE="$(find /home/danila -maxdepth 6 -type f -path '*/toolchain/musl/lib/libc.a' -print -quit 2>/dev/null || true)"
            if [[ -n "$SYSROOT_FILE" ]]; then
              SYSROOT="${SYSROOT_FILE%/lib/libc.a}"
            fi
          fi
          if [[ -z "$SYSROOT" || ! -f "$SYSROOT/lib/libc.a" ]]; then
            echo "ERROR: no persistent KeshOS musl sysroot with lib/libc.a found under /home/danila" >&2
            exit 31
          fi

          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          rm -rf "$GITHUB_WORKSPACE/toolchain/musl"
          ln -s "$SYSROOT" "$GITHUB_WORKSPACE/toolchain/musl"
          echo "KeshOS sysroot: $SYSROOT"

          OPENFYDE=""
          for candidate in \
            "/home/danila/Рабочий стол/openfyde-kesh-work" \
            "/home/danila/openfyde-kesh-work" \
            "$OPENFYDE_WORKSPACE"; do
            if [[ -d "$candidate/src/.git" ]]; then
              OPENFYDE="$candidate"
              break
            fi
          done
          if [[ -z "$OPENFYDE" ]]; then
            OPENFYDE_SRC="$(find /home/danila -maxdepth 5 -type d -path '*/openfyde-kesh-work/src/.git' -print -quit 2>/dev/null || true)"
            if [[ -n "$OPENFYDE_SRC" ]]; then
              OPENFYDE="${OPENFYDE_SRC%/src/.git}"
            fi
          fi
          if [[ -n "$OPENFYDE" ]]; then
            echo "OPENFYDE_WORKSPACE=$OPENFYDE" >> "$GITHUB_ENV"
            echo "OpenFyde workspace: $OPENFYDE"
            echo "OpenFyde HEAD: $(git -C "$OPENFYDE/src" rev-parse HEAD)"
          else
            echo "ERROR: persistent OpenFyde checkout not found" >&2
            exit 32
          fi

      - name: Run approved stage only
        id: staged_build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/bridge-logs
          {
            echo "=== KeshOS staged self-hosted build ==="
            echo "started_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "kesh_commit=$(git rev-parse HEAD)"
            echo "openfyde_workspace=$OPENFYDE_WORKSPACE"
            echo "sysroot=$(readlink -f toolchain/musl 2>/dev/null || true)"
            echo "approved_stage=$KESH_APPROVED_STAGE"
            echo "jobs=$KESH_CHROMIUM_JOBS"
            echo

            case "$KESH_APPROVED_STAGE" in
              platform)
                echo "[stage:platform] Wiring Linux signal ABI into the real KeshOS kernel."
                python3 tools/apply_kernel_signal_foundation.py
                git diff --check
                if ! git diff --quiet -- kernel/linux_syscall.c kernel/process.c generate_ninja.py; then
                  git config user.name "ChatGPT KeshOS Builder"
                  git config user.email "actions@users.noreply.github.com"
                  git add kernel/linux_syscall.c kernel/process.c generate_ninja.py
                  git commit -m "kernel: wire Linux signal compatibility foundation [skip ci]"
                  git push origin HEAD:chatgpt/keshos-openfyde-work
                fi
                python3 generate_ninja.py
                ninja -j4 build/kernel.elf
                test -s build/kernel.elf
                file build/kernel.elf
                nm build/kernel.elf | grep -E 'linux_signal_(rt_sigaction|rt_sigprocmask|kill|tgkill|take_pending)'
                echo "[stage:platform] SUCCESS. Native kernel linked with Linux signal foundation."
                ;;
              gn)
                echo "[stage:gn] Applying overlay and running GN generation only."
                ./ports/chromium_ui/prepare_build.sh "$OPENFYDE_WORKSPACE/src" --gen
                echo "[stage:gn] SUCCESS. Stopping before Ninja compile."
                ;;
              smoke)
                echo "[stage:smoke] Building and validating kesh_smoke only."
                KESH_CHROMIUM_JOBS="$KESH_CHROMIUM_JOBS" \
                  ./ports/chromium_ui/build_smoke.sh "$OPENFYDE_WORKSPACE/src"
                echo "[stage:smoke] SUCCESS. Stopping before KeshOS ISO build."
                ;;
              iso)
                echo "[stage:iso] Running the full approved pipeline through ISO."
                ./ports/chromium_ui/tomorrow_build.sh
                ;;
              *)
                echo "Unknown KESH_APPROVED_STAGE=$KESH_APPROVED_STAGE" >&2
                exit 64
                ;;
            esac
          } 2>&1 | tee build/bridge-logs/full-build.log

      - name: Capture diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p build/bridge-logs
          {
            echo "=== build result ==="
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "workflow_attempt=$GITHUB_RUN_ATTEMPT"
            echo "kesh_commit=$(git rev-parse HEAD 2>/dev/null)"
            echo "approved_stage=$KESH_APPROVED_STAGE"
            echo "finished_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "=== git status ==="
            git status --short
            echo
            echo "=== native kernel output ==="
            ls -lh build/kernel.elf 2>/dev/null || true
            echo
            echo "=== sysroot ==="
            readlink -f toolchain/musl 2>/dev/null || true
            ls -lh toolchain/musl/lib/libc.a 2>/dev/null || true
            echo
            echo "=== GN outputs ==="
            ls -lh "$OPENFYDE_WORKSPACE/src/out/KeshOS/args.gn" \
                   "$OPENFYDE_WORKSPACE/src/out/KeshOS/build.ninja" 2>/dev/null || true
            echo
            echo "=== later-stage outputs ==="
            ls -lh build/keshos.iso ports_bin/kesh_smoke.elf 2>/dev/null || true
            echo
            echo "=== OpenFyde checkout ==="
            if [[ -d "$OPENFYDE_WORKSPACE/src/.git" ]]; then
              git -C "$OPENFYDE_WORKSPACE/src" rev-parse HEAD
              git -C "$OPENFYDE_WORKSPACE/src" status --short | head -200
            else
              echo "OpenFyde checkout not required/present for this stage"
            fi
            echo
            echo "=== disk ==="
            df -h "$GITHUB_WORKSPACE" "$OPENFYDE_WORKSPACE" 2>/dev/null || true
          } > build/bridge-logs/diagnostics.txt 2>&1

      - name: Preserve stage logs locally
        if: always()
        shell: bash
        run: |
          set +e
          DEST="$KESH_ARTIFACT_ROOT/run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$DEST"
          cp -f build/bridge-logs/full-build.log "$DEST/full-build.log" 2>/dev/null || true
          cp -f build/bridge-logs/diagnostics.txt "$DEST/diagnostics.txt" 2>/dev/null || true
          cp -f build/kernel.elf "$DEST/kernel.elf" 2>/dev/null || true
          cp -f "$OPENFYDE_WORKSPACE/src/out/KeshOS/args.gn" "$DEST/args.gn" 2>/dev/null || true
          cp -f "$OPENFYDE_WORKSPACE/src/out/KeshOS/build.ninja" "$DEST/build.ninja" 2>/dev/null || true
          cp -f ports_bin/kesh_smoke.elf "$DEST/kesh_smoke.elf" 2>/dev/null || true
          cp -f build/keshos.iso "$DEST/keshos.iso" 2>/dev/null || true
          printf '%s\n' "$DEST" | tee build/bridge-logs/local-artifact-path.txt
          ls -lh "$DEST"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keshos-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/bridge-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload smoke binary
        if: success() && (env.KESH_APPROVED_STAGE == 'smoke' || env.KESH_APPROVED_STAGE == 'iso')
        uses: actions/upload-artifact@v4
        with:
          name: kesh-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ports_bin/kesh_smoke.elf
          if-no-files-found: error
          retention-days: 7
