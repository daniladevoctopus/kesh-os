name: One-shot framebuffer handoff patch

on:
  push:
    branches:
      - port/openfyde-ozone-kesh

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: port/openfyde-ozone-kesh
          fetch-depth: 0
          submodules: false

      - name: Patch desktop handoff safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/desktop.c')
          text = path.read_text()

          old_inc = '#include "process.h"\n#include "acpi.h"'
          new_inc = '#include "process.h"\n#include "drm_fb.h"\n#include "acpi.h"'
          if old_inc not in text:
              raise SystemExit('desktop include anchor not found')
          text = text.replace(old_inc, new_inc, 1)

          old_pre = '''        int has_user_shell = uwindow_has_desktop_surface();

        if (!has_user_shell) {'''
          new_pre = '''        /* /dev/fb0 is an exclusive direct-scanout lease. When a Ring 3
         * compositor such as OzoneKesh owns it, keep input, network, services
         * and process scheduling alive but stop the legacy desktop from
         * overwriting userspace pixels every frame. */
        if (drm_fb_userspace_owned()) {
            if (process_has_active()) process_step_active();
            timer_wait_ticks(1);
            next_frame_tick = timer_ticks();
            continue;
        }

        int has_user_shell = uwindow_has_desktop_surface();

        if (!has_user_shell) {'''
          if old_pre not in text:
              raise SystemExit('desktop pre-render anchor not found')
          text = text.replace(old_pre, new_pre, 1)

          old_post = '''        if (process_has_active()) {
            process_step_active();
        }

        for (int __wz = 0; __wz < WIN_COUNT; __wz++) {'''
          new_post = '''        if (process_has_active()) {
            process_step_active();
        }

        /* The process may have acquired /dev/fb0 during the step above. Do not
         * swap one last legacy frame over its first Chromium frame. */
        if (drm_fb_userspace_owned()) {
            next_frame_tick = timer_ticks();
            continue;
        }

        for (int __wz = 0; __wz < WIN_COUNT; __wz++) {'''
          if old_post not in text:
              raise SystemExit('desktop post-scheduler anchor not found')
          text = text.replace(old_post, new_post, 1)

          path.write_text(text)
          PY

      - name: Self-remove workflow and commit
        run: |
          rm -f .github/workflows/one-shot-fb-handoff.yml
          git config user.name 'KeshOS Port Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/desktop.c .github/workflows/one-shot-fb-handoff.yml
          git commit -m 'desktop: hand framebuffer scanout to Ring 3 compositor [skip ci]'
          git push origin HEAD:port/openfyde-ozone-kesh
