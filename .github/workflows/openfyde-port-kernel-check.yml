name: OpenFyde Port Kernel Check

on:
  push:
    branches:
      - port/openfyde-ozone-kesh
  workflow_dispatch:

jobs:
  kernel-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld ninja-build python3

      - name: Verify BearSSL pin
        run: |
          test -f src/drivers/net/bearssl/inc/bearssl.h
          echo "BearSSL $(git -C src/drivers/net/bearssl rev-parse HEAD)"

      - name: Generate Ninja graph
        run: python3 generate_ninja.py

      - name: Build kernel ELF
        run: ninja -v build/kernel.elf

      - name: Inspect ELF
        run: |
          file build/kernel.elf
          readelf -h build/kernel.elf
          readelf -l build/kernel.elf
          if readelf -W -l build/kernel.elf | grep 'LOAD' | grep -Eq 'RWE|RW E|R E W'; then
            echo 'Kernel contains a writable+executable LOAD segment.' >&2
            exit 1
          fi

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: keshos-port-kernel
          path: build/kernel.elf
          if-no-files-found: error
