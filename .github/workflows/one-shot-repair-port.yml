name: One-shot repair OpenFyde port source

on:
  push:
    branches:
      - port/openfyde-ozone-kesh

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout port branch
        uses: actions/checkout@v4
        with:
          ref: port/openfyde-ozone-kesh
          fetch-depth: 0

      - name: Remove obsolete duplicate prctl stub
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('kernel/linux_syscall.c')
          text = path.read_text()
          old = '''        /* prctl(option, arg2, arg3, arg4, arg5) */
                  case 157: {
                      return 0;
                  }

                  /* arch_prctl(code, addr) */
                  case LINUX_SYS_PRCTL: {'''
          # Keep indentation matching robust: the actual source has 8 spaces.
          old = old.replace('                  ', '        ')
          new = '''        /* prctl(option, arg2, arg3, arg4, arg5) */
                  case LINUX_SYS_PRCTL: {'''.replace('                  ', '        ')
          if old not in text:
              raise SystemExit('expected duplicate prctl block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Self-remove repair workflow and commit
        run: |
          rm -f .github/workflows/one-shot-repair-port.yml
          git config user.name 'KeshOS Port Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add kernel/linux_syscall.c .github/workflows/one-shot-repair-port.yml
          git commit -m 'kernel: remove duplicate prctl stub [skip ci]'
          git push origin HEAD:port/openfyde-ozone-kesh
