<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KeshOS Package Registry (KPM)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0d13;
      --card-bg: rgba(22, 27, 39, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #34d399;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.15) 0px, transparent 50%);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding: 3rem 1.5rem;
    }
    .container { max-width: 900px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 3rem; }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.85rem;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    h1 { font-size: 2.75rem; font-weight: 700; margin-bottom: 0.75rem; letter-spacing: -0.02em; }
    p.lead { color: var(--text-muted); font-size: 1.15rem; max-width: 600px; margin: 0 auto 1.5rem auto; }
    .install-box {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      padding: 0.75rem 1.25rem;
      border-radius: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      color: var(--accent);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.25rem; margin-top: 2.5rem; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
      backdrop-filter: blur(16px);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 12px 30px var(--accent-glow);
    }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
    .app-title { font-size: 1.25rem; font-weight: 700; }
    .app-ver { font-size: 0.8rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
    .app-desc { color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; margin-bottom: 1.25rem; }
    .app-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid var(--card-border);
      font-size: 0.85rem;
    }
    .code-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .code-btn:hover { background: var(--accent); color: #0b0d13; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">KeshOS Official Ecosystem</div>
      <h1>Kesh Package Manager</h1>
      <p class="lead">Universal package registry for .KEA 64-bit applications. Ready to deploy on Vercel and install directly in KeshOS or Windows.</p>
      <div class="install-box">
        <span>$</span> kpm install notepad.kea
      </div>
    </header>

    <div class="grid" id="packages-list"></div>
  </div>

  <script>
    fetch('/packages.json')
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById('packages-list');
        list.innerHTML = data.packages.map(pkg => `
          <div class="card">
            <div>
              <div class="card-header">
                <span class="app-title">${pkg.name}</span>
                <span class="app-ver">v${pkg.version}</span>
              </div>
              <p class="app-desc">${pkg.description}</p>
            </div>
            <div class="app-meta">
              <span style="color: var(--text-muted); font-family: monospace;">${(pkg.size / 1024).toFixed(1)} KB</span>
              <a href="${pkg.download_url}" class="code-btn" download>Download .KEA</a>
            </div>
          </div>
        `).join('');
      })
      .catch(err => {
        console.log('Local preview mode');
      });
  </script>
</body>
</html>
